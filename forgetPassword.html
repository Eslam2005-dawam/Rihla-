<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rihla_login</title>
    <!-- Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- links  -->

    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <main class="auth-page login-page">
      <div class="auth-card">
        <div class="auth-img">
          <img src="./imgs/auth-img.png" alt="The pyramids of Giza at sunset" />
        </div>
        <div class="auth-content">
          <div class="auth-header">
            <div class="auth-logo">
              <img src="./imgs/Logo.png" alt="brand Rihla" />
            </div>
            <div class="auth-heading">
              <h1>Forgot Password?</h1>
              <p>Don't worry! Enter your email and we'll send you a verification code</p>
            </div>
          </div>

          <form class="auth-form">
            <div class="auth-field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@gmail.com"
                autocomplete="email"
                required
              />
            <button type="submit" class="auth-btn">
                <a href="./verfiyPage.html">Send Verification Code</a>
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>

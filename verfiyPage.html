<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rihla_login</title>
    <!-- Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- links  -->

    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <main class="auth-page verfiy-page">
      <div class="auth-card">
        <div class="auth-img">
          <img src="./imgs/auth-img.png" alt="The pyramids of Giza at sunset" />
        </div>
        <div class="auth-content">
          <div class="auth-header">
            <div class="auth-logo">
              <img src="./imgs/Logo.png" alt="brand Rihla" />
            </div>
            <div class="auth-heading">
              <h1>Verify Your Account</h1>
              <p>Enter the 4-digit code sent to your phone or email.</p>
            </div>
          </div>

          <form class="auth-form verfiy-form">
            <div class="otp-inputs">
                <input type="text"
                  class="otp-input"
                  inputmode="numeric"
                  maxlength="1"
                  autocomplete="onee-time-code"
                  aria-label="verification digit 1" 
                />
                <input type="text"
                  class="otp-input"
                  inputmode="numeric"
                  maxlength="1"
                  aria-label="verification digit 2" 
                />
                <input type="text"
                  class="otp-input"
                  inputmode="numeric"
                  maxlength="1"
                  aria-label="verification digit 3" 
                />
                <input type="text"
                  class="otp-input"
                  inputmode="numeric"
                  maxlength="1"
                  aria-label="verification digit 4" 
                />
            </div>
            <p class="otp-timer" aria-live="polite">00:30</p>
            <button type="submit" class="auth-btn">
                <a href="./restPassword.html">Send Verification Code</a>
            </button>
          </form>

          <p class="auth-switch">
            Didn’t receive OTP?
            <a href="./signup.html">Send Again</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>

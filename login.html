<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rihla_login</title>
    <!-- Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- links  -->

    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <main class="auth-page login-page">
      <div class="auth-card">
        <div class="auth-img">
          <img src="./imgs/auth-img.png" alt="The pyramids of Giza at sunset" />
        </div>
        <div class="auth-content">
          <div class="auth-header">
            <div class="auth-logo">
              <img src="./imgs/Logo.png" alt="brand Rihla" />
            </div>
            <div class="auth-heading">
              <h1>Welcome Back</h1>
              <p>Sign in to your account to continue your journey</p>
            </div>
          </div>

          <form class="auth-form">
            <div class="auth-field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@gmail.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="auth-field">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="*****"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="auth-form-options">
              <label class="auth-check">
                <input type="checkbox" name="remember" />
                Remember me
              </label>
              <a href="./forgetPassword.html">Forget Password?</a>
            </div>
            <button type="submit" class="auth-btn">
              <a href="./index.html">Login</a>
            </button>
          </form>

          <div class="auth-divider">
            <span>Or continue with</span>
          </div>

          <div class="auth-social">
            <button type="button" class="social-btn">
              <img src="./icons/google.svg" alt="Google icon" />
              <span>Google</span>
            </button>

            <button type="button" class="social-btn social-btn--apple">
              <img src="./icons/apple.svg" alt="Apple icon" />
              <span>Apple</span>
            </button>
          </div>

          <p class="auth-switch">
            Don't have an account?
            <a href="./signup.html">Create account</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
